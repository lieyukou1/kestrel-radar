# 事件键里的动作分类：只用于跨天认出同一件事和兜底分组，不参与打分。
# 顺序即优先级（先命中者生效）。
actions:
  - name: incident
    pattern: 暴跌|暴涨|跳水|熔断|违约|破产|暴雷|挤兑|停牌|诉讼|起诉|调查|处罚|罚款|制裁|裁员|召回|plunge|plummet|crash|default|bankrupt|probe|lawsuit|fine|sanction
    ignore_case: true
  - name: policy
    pattern: 加息|降息|降准|上调|下调|利率决议|缩表|扩表|量化宽松|救市|刺激|rate hike|rate cut|raises rates|cuts rates|quantitative easing|taper
    ignore_case: true
  - name: funding
    pattern: 融资|估值|IPO|上市|募资|增发|回购|分红|并购|收购|入股|增持|减持|merger|acquisition|buyback|dividend|valuation|stake
    ignore_case: true
  - name: earnings
    pattern: 财报|业绩|营收|利润|指引|超预期|不及预期|earnings|revenue|profit|guidance|beats|misses
    ignore_case: true
  - name: regulation
    pattern: 监管|合规|法案|新规|牌照|获批|禁令|regulation|regulator|approval|license|ban
    ignore_case: true
  - name: partnership
    pattern: 合作|签约|结盟|合资|联手|partnership|joint venture
    ignore_case: true
  - name: release
    pattern: 发布|推出|公布|上线|launch|release|unveils
    ignore_case: true
  - name: market
    pattern: 上涨|下跌|大涨|大跌|反弹|回调|新高|新低|rally|selloff|record high|record low|surge
    ignore_case: true
default_action: other

# 领域语气：替换提示词里的「你是 XXX」与筛选口径，其余 JSON 约束仍在代码里。
prompts:
  summary_persona: 金融领域的研究助理
  discussion_persona: 金融领域的社区观察员
  deep_read_persona: 金融领域的精读助手
  editor_persona: 金融领域的主编
  community_persona: 财经编辑助手
  off_topic: 与宏观经济、金融市场、公司经营没有实质关系（例如纯科技产品评测、体育娱乐、生活方式）
  promotional: 主体是在卖理财产品、荐股、拉群卖课，或企业合作、签约、揭牌类通稿
  official_examples: 美联储、SEC、欧洲央行、IMF
  dimension_intro: 分类只有这八个，dimension 必须逐字使用：

# 领域级权重覆盖：与 config/weights.yaml 深合并，留空表示沿用全局默认。
weights_overrides:
  # 财经源没有点赞/星数，热度信号稀疏；加权给权威与时效。
  scoring:
    authority: 0.35
    heat: 0.10
    recency: 0.25
    novelty: 0.20
    preference: 0.10
  # 财经新闻时效强：12 小时成熟窗口会让早间日报错过昨夜消息。
  maturity_hours:
    blog: 2
    forum: 2
    paper: 2
    repo: 2
  half_life_hours:
    blog: 24
    forum: 24
  topics:
    # 财经事件以「当天/隔夜」为主，96 小时只会把旧闻带回日报。
    event_window_hours: 48
    standalone: 30
    standalone_min_score: 0.4
  screen:
    # 官方机构发布的是政策与执法信息，豁免「软文」判定，off_topic 照剔。
    official_sources:
      - official_finance
