# 事件键里的动作分类：只用于跨天认出同一件事和兜底分组，不参与打分。
# 顺序即优先级（先命中者生效）。
actions:
  - name: incident
    pattern: 故障|宕机|泄露|诉讼|起诉|争议|封禁|下架|撤回|裁员
  - name: funding
    pattern: 融资|估值|IPO|上市|募资|轮融资|路演
  - name: benchmark
    pattern: 评测|榜单|基准|跑分|得分|benchmark|leaderboard|beats?
    ignore_case: true
  - name: partnership
    pattern: 合作|签约|结盟|接入|集成|联手
  - name: release
    pattern: 发布|上线|推出|正式开放|开源|available|launch|release
    ignore_case: true
default_action: other

# 领域语气：替换提示词里的「你是 XXX」与筛选口径，其余 JSON 约束仍在代码里。
prompts:
  summary_persona: AI 领域的研究助理
  discussion_persona: AI 领域的社区观察员
  deep_read_persona: AI 领域的精读助手
  editor_persona: AI 领域的技术编辑
  community_persona: 技术编辑助手
  off_topic: 与 AI / 大模型没有实质关系（例如量子硬件、芯片制造工艺、传统行业数字化）
  promotional: 主体是在卖产品、服务或方案，或企业合作、签约、揭牌、落地仪式类通稿
  official_examples: OpenAI、DeepMind、NVIDIA、Hugging Face
  dimension_intro: 分类只有这八个，dimension 必须逐字使用：

# 领域级权重覆盖：与 config/weights.yaml 深合并，留空表示沿用全局默认。
weights_overrides: {}
