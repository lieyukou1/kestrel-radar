[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_radar"]

[project]
name = "kestrel-radar"
version = "0.1.0"
description = "A radar that remembers what it already told you: local-first AI intelligence digest"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.0",
    "feedparser>=6.0.14",
    "httpx>=0.27.0",
    "lark-oapi>=1.4",
    "lxml-html-clean>=0.4.5",
    "pypdf>=6.21.1",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.9.0",
    "readability-lxml>=0.9",
    "trafilatura>=2.3.1",
]

[project.scripts]
ai-radar = "ai_radar.__main__:main"
kestrel = "ai_radar.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
